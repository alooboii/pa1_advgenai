extends: base.yaml

model:
  vocab_size: 8192
  max_seq_len: 256
  d_model: 512
  n_layers: 4
  n_q_heads: 16
  n_kv_heads: 4
  d_ff: 1344
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  init_std: 0.02

data:
  dataset_dir: data/tinystories
  metadata_path: data/tinystories/metadata.json
  train_path: data/tinystories/data/train.bin
  validation_path: data/tinystories/data/validation.bin

train:
  run_name: kaggle_11h
  device: cuda
  seed: 42
  sequence_length: 256
  batch_size: 16
  gradient_accumulation_steps: 16
  max_steps: 1000000
  max_duration_seconds: 39600
  duration_warmup_fraction: 0.02
  learning_rate: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 1000
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 16
  log_interval: 5
  checkpoint_interval: 100
  amp: true
  amp_dtype: float16
  resume: false
