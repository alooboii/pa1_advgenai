extends: base.yaml
model:
  max_seq_len: 32
  d_model: 64
  n_layers: 2
  n_q_heads: 4
  n_kv_heads: 2
  d_ff: 192
data:
  train_path: data/debug/train.bin
  validation_path: data/debug/validation.bin
train:
  run_name: debug
  device: cpu
  sequence_length: 32
  batch_size: 4
  max_steps: 20
  learning_rate: 0.001
  warmup_steps: 2
  eval_interval: 10
  eval_batches: 2
  log_interval: 1
  checkpoint_interval: 10
  amp: false
