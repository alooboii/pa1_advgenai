[project]
name = "modern-transformer-assignment"
version = "0.1.0"
description = "A compute-conscious, from-scratch modern Transformer assignment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pyarrow>=20,<26",
    "pyyaml>=6.0,<7",
    "tokenizers>=0.21,<1",
    "torch>=2.6,<3",
    # Kaggle's injected sitecustomize imports wrapt during Python startup.
    "wrapt>=1.17,<3",
]

[dependency-groups]
dev = [
    "nbformat>=5.10,<6",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "instructor_tests"]
addopts = "-ra"
markers = [
    "slow: integration tests that train a model",
    "private: instructor-only tests excluded from the student release",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_transformer"]
